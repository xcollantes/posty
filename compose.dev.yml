# Local development: just Postgres on localhost:5432.
#   docker compose -f compose.dev.yml up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: posty
      POSTGRES_PASSWORD: posty
      POSTGRES_DB: posty
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posty -d posty"]
      interval: 2s
      retries: 30

volumes:
  pgdata-dev:
